
<section
  class="relative min-h-screen overflow-hidden bg-[#4a2937]"
  style="height: 100vh; min-height: 620px; font-family: 'Cormorant Garamond', Georgia, serif;"
>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <!-- Background Video -->
<video
  #weddingVideo
  autoplay
  muted
  loop
  playsinline
  webkit-playsinline
  preload="auto"
  class="absolute inset-0 h-full w-full object-cover"
  style="z-index: 0;"
  aria-hidden="true"
>
  <source src="/video/wedding.mp4" type="video/mp4">
</video>

  <!-- Background Color Overlay -->
  <div
    class="absolute inset-0"
    style="
      z-index: 1;
      background:
        linear-gradient(
          90deg,
          rgba(48, 22, 34, 0.56) 0%,
          rgba(78, 36, 51, 0.28) 50%,
          rgba(48, 22, 34, 0.48) 100%
        ),
        linear-gradient(
          180deg,
          rgba(43, 20, 30, 0.22) 0%,
          rgba(74, 34, 49, 0.12) 48%,
          rgba(35, 17, 26, 0.48) 100%
        );
    "
  ></div>

  <!-- Background Decorative Glow -->
  <div
    class="pointer-events-none absolute inset-0"
    style="
      z-index: 2;
      background:
        radial-gradient(
          ellipse at 50% 42%,
          rgba(255, 218, 202, 0.22) 0%,
          transparent 55%
        ),
        radial-gradient(
          circle at 10% 20%,
          rgba(238, 172, 185, 0.18) 0%,
          transparent 35%
        );
    "
  ></div>

  <!-- Background Music -->
  <audio #audioPlayer loop preload="none">
    <source src="/music/weddingmusic.mp3" type="audio/mpeg">
  </audio>

  <!-- Music Toggle -->
  <button
    type="button"
    (click)="toggleMusic()"
    class="absolute right-5 top-5 z-20 rounded-full border border-white/40
           bg-white/15 px-5 py-3 text-white backdrop-blur-lg
           transition duration-300 hover:bg-white/25 sm:right-8 sm:top-8"
    style="font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 0.12em;"
    [attr.aria-label]="isPlaying ? 'Turn music off' : 'Turn music on'"
  >
    {{ isPlaying ? '♫  MUSIC ON' : '♪  MUSIC OFF' }}
  </button>

  <!-- Main Content -->
  <div
    class="relative z-10 flex h-full flex-col items-center justify-center px-5
           text-center sm:px-8"
    style="color: #fff8f1;"
  >
    <!-- Top Ornament -->
    <div class="mb-7 flex items-center gap-4 sm:mb-9" aria-hidden="true">
      <span class="h-px w-12 sm:w-20" style="background: #f2c9a5;"></span>
      <span style="color: #f5d4aa; font-size: 25px;">✧</span>
      <span class="h-px w-12 sm:w-20" style="background: #f2c9a5;"></span>
    </div>

    <!-- Eyebrow -->
    <p
      class="mb-5 uppercase sm:mb-6"
      style="
        font-family: 'Jost', sans-serif;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.38em;
        color: #ffd7b8;
      "
    >
      Together with our families
    </p>

    <!-- Heading -->
    <h1
      class="max-w-full"
      style="
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(3.5rem, 9vw, 7rem);
        line-height: 0.98;
        font-weight: 300;
        letter-spacing: -0.025em;
        color: #fff8f1;
        text-shadow: 0 3px 30px rgba(30, 10, 20, 0.25);
      "
    >
      Anjana
      <span
        class="inline-block px-1"
        style="color: #ffd09e; font-style: italic; font-weight: 300;"
      >
        &
      </span>
      <br class="sm:hidden">
      <span style="font-style: italic;">Sayuri</span>
    </h1>

    <!-- Decorative Divider -->
    <div class="my-6 flex items-center gap-3 sm:my-8" aria-hidden="true">
      <span class="h-px w-8" style="background: rgba(255, 215, 184, 0.8);"></span>
      <span style="color: #ffd09e; font-size: 15px;">♥</span>
      <span class="h-px w-8" style="background: rgba(255, 215, 184, 0.8);"></span>
    </div>

    <!-- Tagline -->
    <p
      class="uppercase"
      style="
        font-family: 'Jost', sans-serif;
        font-size: clamp(10px, 2vw, 13px);
        font-weight: 300;
        letter-spacing: 0.3em;
        color: #ffe7d7;
      "
    >
      We are getting married
    </p>

    <!-- Date -->
    <div
      class="my-7 flex items-center justify-center gap-4 sm:my-9 sm:gap-6"
      style="color: #fff0df;"
    >
      <span
        class="uppercase"
        style="font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 0.18em;"
      >
        December
      </span>

      <span class="h-1 w-1 rounded-full" style="background: #ffd09e;"></span>

      <span style="font-family: 'Cormorant Garamond', serif; font-size: 29px;">
        15
      </span>

      <span class="h-1 w-1 rounded-full" style="background: #ffd09e;"></span>

      <span
        style="font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 0.15em;"
      >
        2026
      </span>
    </div>

    <!-- Open Invitation Button -->
    <button
      type="button"
      (click)="openInvitation()"
      class="group inline-flex items-center gap-4 rounded-full px-8 py-4
             transition-all duration-300 hover:-translate-y-1
             hover:shadow-2xl sm:px-10"
      style="
        background: linear-gradient(135deg, #ffe3c7 0%, #e8b982 100%);
        color: #562c3b;
        border: 1px solid rgba(255, 248, 241, 0.8);
        box-shadow: 0 8px 30px rgba(30, 10, 20, 0.18);
        font-family: 'Jost', sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
      "
    >
      Open Invitation
      <span
        class="transition-transform duration-300 group-hover:translate-x-1"
        style="font-size: 18px;"
      >
        →
      </span>
    </button>

    <!-- Bottom Caption -->
    <p
      class="absolute bottom-9 px-4 uppercase sm:bottom-11"
      style="
        font-family: 'Jost', sans-serif;
        font-size: 9px;
        letter-spacing: 0.28em;
        color: rgba(255, 231, 215, 0.85);
      "
    >
      A beautiful beginning · A lifetime of love
    </p>
  </div>
</section>
