
<section
  class="relative min-h-screen overflow-hidden bg-[#3B3025]"
  style="
    height: 100vh;
    height: 100svh;
    min-height: 600px;
    font-family: 'Cormorant Garamond', Georgia, serif;
  "
>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <!-- Background Wedding Video -->
<video
  #weddingVideo
  autoplay
  muted
  loop
  playsinline
  preload="auto"
  class="absolute inset-0 h-full w-full object-cover
         object-[center_45%]"
  style="z-index: 0;"
  aria-hidden="true"
>
  <source src="/video/wedding.mp4" type="video/mp4">
</video>

  <!-- Champagne Brown Overlay -->
  <div
    class="absolute inset-0"
    style="
      z-index: 1;
      background:
        linear-gradient(
          90deg,
          rgba(48, 38, 27, 0.32) 0%,
          rgba(65, 49, 34, 0.12) 50%,
          rgba(48, 38, 27, 0.30) 100%
        ),
        linear-gradient(
          180deg,
          rgba(35, 28, 21, 0.18) 0%,
          rgba(55, 42, 29, 0.06) 45%,
          rgba(35, 26, 19, 0.42) 100%
        );
    "
  ></div>

  <!-- Soft Golden Glow -->
  <div
    class="pointer-events-none absolute inset-0"
    style="
      z-index: 2;
      background:
        radial-gradient(
          ellipse at 50% 40%,
          rgba(255, 239, 211, 0.14) 0%,
          transparent 55%
        );
    "
  ></div>

  <!-- Background Music -->
  <audio #audioPlayer loop preload="none">
    <source src="/music/weddingmusic.mp3" type="audio/mpeg">
  </audio>

  <!-- Music Toggle -->
  <button
    type="button"
    (click)="toggleMusic()"
    class="absolute right-5 top-5 z-20 rounded-full
           border border-[#E8C58A]/60 bg-black/20
           px-4 py-3 text-[#FFF9EF] backdrop-blur-md
           transition duration-300 hover:bg-black/35
           sm:right-8 sm:top-8"
    style="
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
    "
    [attr.aria-label]="isPlaying ? 'Turn music off' : 'Turn music on'"
  >
    {{ isPlaying ? '♫  MUSIC ON' : '♪  MUSIC OFF' }}
  </button>

  <!-- Main Content -->
  <div
    class="relative z-10 flex h-full flex-col
           items-center justify-center px-5
           text-center sm:px-8"
    style="color: #FFF9EF;"
  >

    <!-- Top Ornament -->
    <div
      class="mb-6 flex items-center gap-4 sm:mb-8"
      aria-hidden="true"
    >
      <span
        class="h-px w-12 sm:w-20"
        style="background: rgba(232, 197, 138, 0.85);"
      ></span>

      <svg
        width="25"
        height="25"
        viewBox="0 0 25 25"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M12.5 2 L15.5 9.5 L23 12.5 L15.5 15.5 L12.5 23 L9.5 15.5 L2 12.5 L9.5 9.5 Z"
          stroke="#E8C58A"
          stroke-width="0.8"
        />
      </svg>

      <span
        class="h-px w-12 sm:w-20"
        style="background: rgba(232, 197, 138, 0.85);"
      ></span>
    </div>

    <!-- Eyebrow -->
    <p
      class="mb-5 uppercase sm:mb-6"
      style="
        font-family: 'Jost', sans-serif;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.32em;
        color: #F0D8B1;
      "
    >
      Together with our families
    </p>

    <!-- Couple Names -->
    <h1
      class="max-w-full"
      style="
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(3.4rem, 9vw, 7rem);
        line-height: 1.02;
        font-weight: 300;
        letter-spacing: -0.025em;
        color: #FFF9EF;
        text-shadow: 0 3px 24px rgba(30, 22, 13, 0.35);
        margin: 0;
      "
    >
      Anjana

      <span
        class="inline-block px-1"
        style="
          color: #E8C58A;
          font-style: italic;
          font-weight: 300;
        "
      >
        &amp;
      </span>

      <br class="sm:hidden">

      <span style="font-style: italic;">
        Sayuri
      </span>
    </h1>

    <!-- Gold Divider -->
    <div
      class="my-6 flex items-center gap-3 sm:my-8"
      aria-hidden="true"
    >
      <span
        class="h-px w-9"
        style="background: rgba(232, 197, 138, 0.8);"
      ></span>

      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="#E8C58A"
        aria-hidden="true"
      >
        <path
          d="M12 21s-9-5.7-9-12a5 5 0 0 1 9-3.1A5 5 0 0 1 21 9c0 6.3-9 12-9 12Z"
        />
      </svg>

      <span
        class="h-px w-9"
        style="background: rgba(232, 197, 138, 0.8);"
      ></span>
    </div>

    <!-- Tagline -->
    <p
      class="uppercase"
      style="
        font-family: 'Jost', sans-serif;
        font-size: clamp(10px, 2vw, 12px);
        font-weight: 300;
        letter-spacing: 0.27em;
        color: #F5E7D1;
      "
    >
      We are getting married
    </p>

    <!-- Wedding Date -->
    <div
      class="my-7 flex items-center justify-center gap-3
             sm:my-9 sm:gap-6"
      style="color: #FFF0DF;"
    >
      <span
        class="uppercase"
        style="
          font-family: 'Jost', sans-serif;
          font-size: 11px;
          letter-spacing: 0.15em;
        "
      >
        December
      </span>

      <span
        class="h-1 w-1 rounded-full"
        style="background: #E8C58A; flex-shrink: 0;"
      ></span>

      <span
        style="
          font-family: 'Cormorant Garamond', Georgia, serif;
          font-size: 30px;
          font-weight: 400;
        "
      >
        15
      </span>

      <span
        class="h-1 w-1 rounded-full"
        style="background: #E8C58A; flex-shrink: 0;"
      ></span>

      <span
        style="
          font-family: 'Jost', sans-serif;
          font-size: 11px;
          letter-spacing: 0.15em;
        "
      >
        2026
      </span>
    </div>

    <!-- Open Invitation Button -->
    <button
      type="button"
      (click)="openInvitation()"
      class="group inline-flex items-center gap-4
             rounded-full px-8 py-4 sm:px-10
             transition-all duration-300
             hover:-translate-y-1 hover:shadow-2xl
             focus-visible:outline focus-visible:outline-2
             focus-visible:outline-offset-4
             focus-visible:outline-[#E8C58A]"
      style="
        background: linear-gradient(
          135deg,
          #FFF5E5 0%,
          #E8C58A 100%
        );
        color: #55402B;
        border: 1px solid rgba(255, 249, 239, 0.85);
        box-shadow: 0 8px 30px rgba(30, 22, 13, 0.22);
        font-family: 'Jost', sans-serif;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        cursor: pointer;
      "
    >
      Open Invitation

      <span
        class="transition-transform duration-300
               group-hover:translate-x-1"
        style="font-size: 18px;"
        aria-hidden="true"
      >
        →
      </span>
    </button>

    <!-- Bottom Caption -->
    <p
      class="absolute bottom-8 px-4 uppercase sm:bottom-10"
      style="
        font-family: 'Jost', sans-serif;
        font-size: 9px;
        font-weight: 300;
        letter-spacing: 0.22em;
        line-height: 1.8;
        color: rgba(255, 249, 239, 0.9);
        text-shadow: 0 1px 8px rgba(30, 22, 13, 0.35);
      "
    >
      A beautiful beginning · A lifetime of love
    </p>

  </div>
</section>
